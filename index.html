<body>
<div class="startup" id="startup"><div class="startupCard"><div class="startupMark">M</div><div class="startupTitle">Mauritius ’26</div><div class="startupText">Syncing your trip…</div><div class="startupSpinner"></div></div></div>
<main class="wrap scheduleMode">
<header class="top"><div><div class="eyebrow">OUR ISLAND TRIP</div><h1>Mauritius ’26</h1><div class="subtitle">13–21 October · Maria + Dil</div></div><div class="sync"><span class="syncDot"></span><span id="status">Connecting</span></div></header>

<section id="schedule" class="view on">
<div class="dayCard"><div class="monthRow"><strong id="selectedDate"></strong><span>Tap a day</span></div><div class="days" id="days"></div></div>
<div class="sectionTitle"><h2>Plan</h2><span id="eventCount"></span></div><div class="list" id="events"></div>
</section>

<section id="expenses" class="view">
<div class="summary"><div class="stat"><span>Maria paid</span><strong id="m">€0</strong></div><div class="stat"><span>Dil paid</span><strong id="d">€0</strong></div></div>
<div class="balance" id="bal"></div>
<div class="sectionTitle"><h2>Expenses</h2><span id="expenseCount"></span></div><div class="expenseFilters" id="expenseFilters"><button class="filter on" data-filter="all">All</button><button class="filter" data-filter="pending">Pending</button><button class="filter" data-filter="partial">Partial</button><button class="filter" data-filter="paid">Paid</button><button class="filter" data-filter="Maria">Maria</button><button class="filter" data-filter="Dil">Dil</button></div><div class="list" id="expensesList"></div>
</section>
</main>

<nav class="bottom"><button class="tab on" data-v="schedule">Schedule</button><button class="plus" id="plus">+</button><button class="tab" data-v="expenses">Expenses</button></nav>

<div class="modal" id="choiceModal"><div class="sheet"><div class="grabber"></div><div class="sheetHead"><div><div class="sheetKicker">ADD TO TRIP</div><h2>What are we adding?</h2></div><button class="close" id="choiceCancel">×</button></div><div class="form"><button class="choice" id="addActivity"><span class="choiceIcon">＋</span><span><strong>Activity</strong><small>Add something to the daily plan</small></span></button><button class="choice" id="addExpense"><span class="choiceIcon">€</span><span><strong>Expense</strong><small>Track something one of us paid for</small></span></button></div></div></div>

<div class="modal" id="activityModal"><div class="sheet"><div class="grabber"></div><div class="sheetHead"><div><div class="sheetKicker">SCHEDULE</div><h2 id="activityHeading">Add activity</h2></div><button class="close" id="activityClose">×</button></div><form class="form" id="activityForm">
<div class="field"><label>NAME</label><input id="name" required placeholder="Whale swimming"></div>
<div class="grid2"><div class="field"><label>DAY</label><select id="day"></select></div><div class="field"><label>TIME</label><input id="time" type="time"></div></div>
<div class="field"><label>LOCATION</label><input id="loc" placeholder="Black River"></div>
<div class="field"><label>GOOGLE MAPS LINK</label><input id="maps" type="url" placeholder="Paste a Google Maps link"></div>
<div class="field"><label>NOTES</label><textarea id="notes" placeholder="Meeting point, booking details…"></textarea></div>

<div class="actions"><button type="button" class="action cancel" id="activityCancel">Cancel</button><button class="action save">Save activity</button></div>
</form></div></div>

<div class="modal" id="expenseModal"><div class="sheet">
<div class="grabber"></div>

<div class="field"><label>HOW MUCH DID YOU PAY?</label><input id="expensePaid" type="number" min="0" step=".01" inputmode="decimal" required placeholder="0"></div>

</form></div></div>

const dates=Array.from({length:9},(_,i)=>new Date(Date.UTC(2026,9,13+i)).toISOString().slice(0,10));

const short=d=>new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
async function api(method="GET",body){const r=await fetch(API,{method,headers:{"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){try{const x=await api();S={people:["Maria","Dil"],events:x.events||[],expenses:x.expenses||[]};lastUpdated=x.updated_at||"";render();$("status").textContent="Synced";$("startup").classList.add("hidden")}catch(e){$("status").textContent="Offline";$("startup").querySelector(".startupText").textContent="Couldn’t sync the trip";$("startup").querySelector(".startupSpinner").style.display="none";console.error(e)}}
async function save(){ $("status").textContent="Saving…";try{const x=await api("PUT",S);lastUpdated=x.updated_at||"";$("status").textContent="Synced"}catch(e){$("status").textContent="Save failed";console.error(e)}}
async function refresh(){try{const x=await api();if(x.updated_at!==lastUpdated){S={people:["Maria","Dil"],events:x.events||[],expenses:x.expenses||[]};lastUpdated=x.updated_at||"";render()}$("status").textContent="Synced"}catch(e){$("status").textContent="Offline"}}
function toEur(v,c){return c==="MUR"?(+v||0)*rate:(+v||0)}
function stat(total,paid){return +paid<=0?"pending":+paid>=+total?"paid":"partial"}
function render(){
 $("days").innerHTML=dates.map(d=>{const x=new Date(d+"T12:00:00"),has=S.events.some(e=>e.day===d);return '<button type="button" class="day '+(d===sel?"on ":"")+(has?"has":"")+'" data-d="'+d+'"><span class="dow">'+x.toLocaleDateString("en-GB",{weekday:"short"})+'</span><b>'+x.getDate()+"</b></button>"}).join("");
 document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{sel=b.dataset.d;render()});
 $("selectedDate").textContent=label(sel);
 const ev=S.events.filter(e=>e.day===sel).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
 $("eventCount").textContent=ev.length?(ev.length+" "+(ev.length===1?"thing":"things")):"Nothing yet";
 $("events").innerHTML=ev.length?ev.map(e=>'<div class="event"><div class="time">'+esc(e.time||"All day")+'</div><div><h3>'+esc(e.name)+'</h3>'+(e.location?'<div class="meta">'+esc(e.location)+"</div>":"")+(e.maps?'<a class="maps" target="_blank" rel="noopener" href="'+esc(e.maps)+'">Open in Google Maps ↗</a>':"")+(e.notes?'<div class="meta" style="margin-top:7px">'+esc(e.notes)+"</div>":"")+(e.cost?'<div class="meta" style="margin-top:7px">'+eur(e.cost)+" · "+esc(e.payer||"")+"</div>":"")+'</div><div class="rowBtns"><button class="mini" data-edit-event="'+esc(e.id)+'">✎</button><button class="mini" data-remove-event="'+esc(e.id)+'">×</button></div></div>').join(""):'<div class="empty">Nothing planned for this day.<br>Tap + to add something.</div>';
 let m=0,d=0;S.expenses.forEach(e=>e.payer==="Maria"?m+=+e.amount||0:d+=+e.amount||0);$("m").textContent=eur(m);$("d").textContent=eur(d);
 const diff=m-d;$("bal").innerHTML=diff===0?"<span>Everything is even</span><strong>€0 owed</strong>":diff>0?'<span>Dil owes Maria</span><strong>'+eur(diff/2)+"</strong>":'<span>Maria owes Dil</span><strong>'+eur(-diff/2)+"</strong>";
 const filteredExpenses=S.expenses.filter(e=>{if(expenseFilter==="all")return true;if(expenseFilter==="Maria"||expenseFilter==="Dil")return e.payer===expenseFilter;const total=+e.total||+e.amount||0,paid=+e.paid||+e.amount||0;return stat(total,paid)===expenseFilter});
 $("expenseCount").textContent=filteredExpenses.length?String(filteredExpenses.length):"Nothing yet";
 document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("on",b.dataset.filter===expenseFilter));
 $("expensesList").innerHTML=filteredExpenses.length ? filteredExpenses.slice().reverse().map(e=>{
   const total=+e.total||+e.amount||0, paid=+e.paid||+e.amount||0, cur=e.currency||"EUR", st=stat(total,paid), rem=Math.max(0,total-paid);
   const shown=cur==="MUR"?Math.round(paid).toLocaleString()+" MUR":eur(paid);
   const badge=st==="paid"?"Paid":st==="partial"?"Partially paid":"Pending";
   const remaining=rem>0?'<div class="remaining">Remaining: '+(eur(toEur(rem,cur)))+"</div>":"";
   return '<div class="expense status-'+st+'"><div><div class="expenseTitle">'+esc(e.name)+'</div><div class="expenseMeta">'+esc(e.payer)+" · "+shown+(cur==="MUR"?" · "+eur(toEur(paid,cur)):"")+'</div><span class="badge '+st+'">'+badge+'</span>'+remaining+'</div><div class="expenseRight"><strong>'+eur(e.amount)+'</strong><div class="rowBtns" style="justify-content:flex-end;margin-top:7px"><button class="mini" data-edit-expense="'+esc(e.id)+'">✎</button><button class="mini" data-remove-expense="'+esc(e.id)+'">×</button></div></div></div>';
 }).join("") : '<div class="empty">No expenses yet.<br>Tap + to add one.</div>';
}
function modal(id){document.querySelectorAll(".modal").forEach(x=>x.classList.remove("on"));$(id).classList.add("on")}
function close(){document.querySelectorAll(".modal").forEach(x=>x.classList.remove("on"))}
function view(v){document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id===v));document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.v===v));document.querySelector(".wrap").classList.toggle("expensesMode",v==="expenses");document.querySelector(".wrap").classList.toggle("scheduleMode",v==="schedule");document.body.classList.toggle("expensesPage",v==="expenses");document.body.classList.toggle("schedulePage",v==="schedule")}
function fillDays(){$("day").innerHTML=dates.map(d=>'<option value="'+d+'">'+short(d)+"</option>").join("")}
function openActivity(id){fillDays();$("activityForm").dataset.id=id||"";$("activityHeading").textContent=id?"Edit activity":"Add activity";if(id){const e=S.events.find(x=>x.id===id);$("name").value=e?.name||"";$("day").value=e?.day||sel;$("time").value=e?.time||"";$("loc").value=e?.location||"";$("maps").value=e?.maps||"";$("notes").value=e?.notes||"";$("cost").value=e?.cost||"";$("payer").value=e?.payer||"Maria"}else{$("activityForm").reset();$("day").value=sel;$("payer").value="Maria"}modal("activityModal")}
function expenseChoice(){
 const f=$("expenseForm");
 document.querySelectorAll("#currencyChoices button").forEach(b=>b.classList.toggle("on",b.dataset.currency===f.dataset.currency));
 document.querySelectorAll("#payerChoices button").forEach(b=>b.classList.toggle("on",b.dataset.payer===f.dataset.payer));
 const partial=f.dataset.partial==="1";
 $("remainingBox").classList.toggle("hidden",!partial);
 $("paymentSummary").classList.toggle("hidden",!partial);
 $("partialToggle").classList.toggle("on",partial);
 if(partial){
   const paid=+$("expensePaid").value||0, rem=+$("expenseRemaining").value||0, c=f.dataset.currency||"EUR";
   $("totalCostPreview").textContent=eur(toEur(paid+rem,c));$("paidNowPreview").textContent=eur(toEur(paid,c));$("stillPreview").textContent=eur(toEur(rem,c));
 }
}
function expensePreview(){
 const f=$("expenseForm"),c=f.dataset.currency||"EUR";$("paidNowPreview").textContent=eur(toEur(+$("expensePaid").value||0,c));$("stillPreview").textContent=eur(toEur(+$("expenseRemaining").value||0,c));
 $("rateText").textContent=c==="MUR"?"1 MUR ≈ "+rate.toFixed(6)+" EUR · only the amount paid counts toward the split":"";
 expenseChoice();
}
async function getRate(){try{const x=await(await fetch("https://open.er-api.com/v6/latest/MUR")).json();if(x?.rates?.EUR)rate=x.rates.EUR}catch(e){}expensePreview()}
function openExpense(id){
 const f=$("expenseForm");
 $("expenseError").textContent="";f.dataset.id=id||"";
 $("expenseHeading").textContent=id?"Edit expense":"Add expense";
 f.reset();
 if(id){
   const e=S.expenses.find(x=>x.id===id);
   const paid=+e?.paid||+e?.amount||0,total=+e?.total||paid;
   $("expenseTitle").value=e?.name||"";
   $("expensePaid").value=e?.paid??e?.amount??"";
   $("expenseRemaining").value=Math.max(0,total-paid);
   f.dataset.currency=e?.currency||"EUR";
   f.dataset.payer=e?.payer||"";
   f.dataset.partial=total>paid?"1":"0";
 }else{
   f.dataset.currency="";f.dataset.payer="";f.dataset.partial="0";
   $("expenseRemaining").value="";
 }
 expenseChoice();expensePreview();modal("expenseModal");
 if(f.dataset.currency==="MUR")getRate();
}
async function expenseSubmit(ev){
 ev.preventDefault();
 const f=ev.currentTarget,title=$("expenseTitle").value.trim(),paid=+$("expensePaid").value||0,c=f.dataset.currency,payer=f.dataset.payer,partial=f.dataset.partial==="1",remaining=partial?(+$("expenseRemaining").value||0):0,total=paid+remaining;
 $("expenseError").textContent="";
 if(!title)return $("expenseError").textContent="Add a title.";
 if(!c)return $("expenseError").textContent="Choose EUR or MUR.";
 if(!payer)return $("expenseError").textContent="Choose who paid.";
 if(paid<0)return $("expenseError").textContent="Enter a valid amount.";
 if(partial&&remaining<0)return $("expenseError").textContent="Enter a valid remaining amount.";
 if(paid===0&&!partial)return $("expenseError").textContent="Turn on “Not fully paid” and enter the amount still to pay.";
 const id=f.dataset.id||uid(),x={id,name:title,amount:toEur(paid,c),payer,currency:c,total,paid,status:stat(total,paid),remaining:toEur(remaining,c)};
 S.expenses=S.expenses.some(v=>v.id===id)?S.expenses.map(v=>v.id===id?{...v,eventId:v.eventId,...x}:v):[...S.expenses,x];
 close();render();await save();
}
async function activitySubmit(ev){ev.preventDefault();const f=ev.currentTarget,id=f.dataset.id||uid(),x={id,name:$("name").value.trim(),day:$("day").value,time:$("time").value,location:$("loc").value.trim(),maps:$("maps").value.trim(),notes:$("notes").value.trim(),cost:+$("cost").value||0,payer:$("payer").value};if(!x.name)return;const old=S.events.find(v=>v.id===id);S.events=old?S.events.map(v=>v.id===id?x:v):[...S.events,x];const linked=S.expenses.find(v=>v.eventId===id);if(linked){if(x.cost)S.expenses=S.expenses.map(v=>v.id===linked.id?{...v,name:x.name,amount:x.cost,total:x.cost,paid:x.cost,payer:x.payer,currency:"EUR",status:"paid",remaining:0}:v);else S.expenses=S.expenses.filter(v=>v.id!==linked.id)}else if(x.cost)S.expenses=[...S.expenses,{id:uid(),eventId:id,name:x.name,amount:x.cost,total:x.cost,paid:x.cost,payer:x.payer,currency:"EUR",status:"paid",remaining:0}];close();render();await save()}
async function removeEvent(id){if(!confirm("Delete this activity?"))return;S.events=S.events.filter(e=>e.id!==id);S.expenses=S.expenses.filter(e=>e.eventId!==id);render();await save()}
async function removeExpense(id){if(!confirm("Delete this expense?"))return;S.expenses=S.expenses.filter(e=>e.id!==id);render();await save()}
function editEvent(id){openActivity(id)}function editExpense(id){openExpense(id)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>view(b.dataset.v));document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{expenseFilter=b.dataset.filter;render()});
$("plus").onclick=()=>modal("choiceModal");$("choiceCancel").onclick=close;$("addActivity").onclick=()=>openActivity();$("addExpense").onclick=()=>openExpense();$("activityCancel").onclick=close;$("activityClose").onclick=close;$("expenseCancel").onclick=close;$("expenseClose").onclick=close;
$("activityForm").onsubmit=activitySubmit;$("expenseForm").onsubmit=expenseSubmit;
document.querySelectorAll("#currencyChoices button").forEach(b=>b.onclick=()=>{$("expenseForm").dataset.currency=b.dataset.currency;expensePreview();if(b.dataset.currency==="MUR")getRate()});
document.querySelectorAll("#payerChoices button").forEach(b=>b.onclick=()=>{$("expenseForm").dataset.payer=b.dataset.payer;expenseChoice()});
$("partialToggle").onclick=()=>{const f=$("expenseForm");f.dataset.partial=f.dataset.partial==="1"?"0":"1";expenseChoice()};
$("expensePaid").oninput=()=>{const f=$("expenseForm");if((+$("expensePaid").value||0)===0){f.dataset.partial="1"}else if(f.dataset.partial==="1"&&!$("expenseRemaining").value){/* keep pending mode until user turns it off */}expensePreview()};
$("expenseRemaining").oninput=expensePreview;
document.addEventListener("click",e=>{const b=e.target.closest("[data-edit-event],[data-remove-event],[data-edit-expense],[data-remove-expense]");if(!b)return;if(b.dataset.editEvent)editEvent(b.dataset.editEvent);else if(b.dataset.removeEvent)removeEvent(b.dataset.removeEvent);else if(b.dataset.editExpense)editExpense(b.dataset.editExpense);else removeExpense(b.dataset.removeExpense)});
document.querySelectorAll(".modal").forEach(m=>m.onclick=e=>{if(e.target===m)close()});
load();setInterval(refresh,10000);
</script>
</body></html>
