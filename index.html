<style>

tems:flex-end;z-index:30}.modal.on{display:flex}.sheet{background:var(--bg);width:100%;max-width:600px;margin:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;max-height:90vh;overflow:auto}.sheet h2{margin:3px 0 0;font-size:25px;letter-spacing:-.04em}.sheetTop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.closeBtn{border:0;background:#e9e6df;width:36px;height:36px;border-radius:50%;font-size:24px;line-height:1;color:#555}.form{display:grid;gap:11px}.form label{font-weight:700;font-size:13px}input,select,textarea{width:100%;padding:13px;margin-top:5px;border:1px solid #ddd8cf;border-radius:13px;background:#fff;outline:none;font-size:16px;line-height:1.25;min-width:0}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}textarea{min-height:76px}.actions{display:flex;gap:8px;margin-top:4px}.actions button{flex:1}.ghost,.save{border:0;padding:13px 17px;border-radius:13px;font-weight:800}.ghost{background:#fff}.save{background:var(--ink);color:#fff}.choiceGrid{display:grid;gap:10px}.choice{border:1px solid var(--line);background:#fff;border-radius:18px;padding:17px;text-align:left}.choice b{display:block;font-size:17px;margin-bottom:3px}.choice span{color:var(--muted)}.segmented{display:grid;grid-template-columns:1fr 1fr;gap:6px}.segmented button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:800;color:var(--muted);font-size:14px}.segmented button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 10px;font-weight:800;color:var(--muted)}.segmented button.on{background:var(--green);color:#fff;border-color:var(--green)}.helper{font-size:12px;color:var(--muted);min-height:16px}.hidden{display:none!important}.amountRow{display:grid;grid-template-columns:minmax(0,1fr) 145px;gap:10px;align-items:end}.fieldLabel,.form>label,.amountRow label{font-weight:700;font-size:13px}.partialToggle{width:100%;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;font-weight:700;text-align:left}.toggle{width:38px;height:23px;border-radius:20px;background:#ddd8cf;position:relative}.toggle:after{content:"";position:absolute;width:19px;height:19px;top:2px;left:2px;border-radius:50%;background:#fff;transition:.18s}.partialToggle.on .toggle{background:var(--green)}.partialToggle.on .toggle:after{left:17px}.error{color:#9b3c32;font-size:13px}@media(max-width:560px){.days{gap:1px}.day{padding:8px 1px}.day b{font-size:17px}h1{font-size:35px}.event{grid-template-columns:50px 1fr auto}}
</style></head><body><div class="wrap">
<header class="header"><div><div class="kicker">OUR ISLAND TRIP</div><h1>Mauritius ’26</h1><div class="subtitle">13–21 October · Maria + Dil</div></div><div class="status"><span class="dot"></span><span id="status">Connecting</span></div></header>
<section id="schedule" class="view on"><div class="calendar"><div class="calendarHead"><div class="calendarTitle" id="selectedDate"></div><div class="calendarHint">Tap a day</div></div><div class="days" id="days"></div></div><div class="card" id="events"></div></section>
<section id="expenses" class="view"><div class="summary"><div class="stat"><span class="muted">Maria paid</span><strong id="m">€0</strong></div><div class="stat"><span class="muted">Dil paid</span><strong id="d">€0</strong></div></div><div class="balance" id="bal"></div><div class="card" id="expensesList"></div></section></div>
<nav class="bottom"><button data-v="schedule" class="on">Schedule</button><button class="plus" id="plus">+</button><button data-v="expenses">Expenses</button></nav>
<div class="modal" id="choiceModal"><div class="sheet"><h2>Add to trip</h2><div class="choiceGrid"><button class="choice" id="addActivity"><b>＋ Activity</b><span>Add something to the daily schedule</span></button><button class="choice" id="addExpense"><b>＋ Expense</b><span>Record something one of you paid for</span></button><button class="ghost" id="choiceCancel">Cancel</button></div></div></div>
<div class="modal" id="activityModal"><div class="sheet"><h2 id="activityHeading">Add activity</h2><form class="form" id="activityForm"><label>Name<input id="name" required placeholder="Whale swimming"></label><div class="row"><label>Day<select id="day"></select></label><label>Time<input id="time" type="time"></label></div><label>Location<input id="loc" placeholder="Black River"></label><label>Google Maps link<input id="maps" type="url" placeholder="https://maps.google.com/..."></label><label>Notes<textarea id="notes" placeholder="Booking details, meeting point…"></textarea></label><div class="row"><label>Cost (EUR)<input id="cost" type="number" min="0" step=".01" placeholder="0"></label><label>Paid by<select id="payer"><option>Maria</option><option>Dil</option></select></label></div><div class="actions"><button type="button" class="ghost" id="activityCancel">Cancel</button><button class="save">Save activity</button></div></form></div></div>
<div class="modal" id="expenseModal"><div class="sheet expenseSheet">
  <div class="sheetTop"><div><div class="kicker">EXPENSE</div><h2 id="expenseHeading">Add expense</h2></div><button type="button" class="closeBtn" id="expenseClose">×</button></div>
  <form class="form" id="expenseForm">
    <label>What was it?<input id="expenseTitle" required placeholder="Lunch, whale tour, car…"></label>
    <div class="amountRow"><label>Amount paid<input id="expensePaid" type="number" min="0" step=".01" inputmode="decimal" required placeholder="0"></label><div><div class="fieldLabel">Currency</div><div class="segmented" id="currencyChoices"><button type="button" data-currency="EUR">€ EUR</button><button type="button" data-currency="MUR">Rs MUR</button></div></div></div>
    <label>Paid by</label>
    <div class="segmented" id="payerChoices"><button type="button" data-payer="Maria">Maria</button><button type="button" data-payer="Dil">Dil</button></div>
    <button type="button" class="partialToggle" id="partialToggle"><span>Reservation / deposit</span><span class="toggle" id="partialSwitch"></span></button>
    <div id="totalBox" class="hidden"><label>Total amount due<input id="expenseTotal" type="number" min="0" step=".01" inputmode="decimal" placeholder="0"></label></div>
    <div class="helper" id="rateText"></div><div class="error" id="expenseError"></div>
    <div class="actions"><button type="button" class="ghost" id="expenseCancel">Cancel</button><button class="save">Save expense</button></div>
  </form>
</div></div>
<script>
const API="https://flcnidtinfhpjdvqvegl.supabase.co/functions/v1/trip-api",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsY25pZHRpbmZocGpkdnF2ZWdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTkwMTAsImV4cCI6MjEwNjc3NTAxMH0.jBWofh1-jw_8tNAJJsFDigNpU2LT-FM6zlTHTE7o9h0";
const $=id=>document.getElementById(id),dates=Array.from({length:9},(_,i)=>new Date(Date.UTC(2026,9,13+i)).toISOString().slice(0,10));let S={people:["Maria","Dil"],events:[],expenses:[]},sel=dates[0],rate=.0185,lastUpdated="",editingStatus="paid";
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),eur=n=>"€"+(+n||0).toFixed(2).replace(/\.00$/,""),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),label=d=>new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}),short=d=>new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
async function api(method="GET",body){let r=await fetch(API,{method,headers:{"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){try{let x=await api();S={people:["Maria","Dil"],events:x.events||[],expenses:x.expenses||[]};lastUpdated=x.updated_at||"";render();$("status").textContent="Synced"}catch(e){$("status").textContent="Offline"}}
async function save(){ $("status").textContent="Saving…";try{let x=await api("PUT",S);lastUpdated=x.updated_at||"";$("status").textContent="Synced"}catch(e){$("status").textContent="Save failed";console.error(e)}}
async function refresh(){try{let x=await api();if(x.updated_at!==lastUpdated){S={people:["Maria","Dil"],events:x.events||[],expenses:x.expenses||[]};lastUpdated=x.updated_at||"";render()}$("status").textContent="Synced"}catch(e){$("status").textContent="Offline"}}
function toEur(v,c){return c==="MUR"?(+v||0)*rate:(+v||0)}function stat(total,paid){return +paid<=0?"pending":+paid>=+total?"paid":"partial"}
function render(){
  $("days").innerHTML=dates.map(d=>{
    const x=new Date(d+"T12:00:00"),has=S.events.some(e=>e.day===d);
    return `<button type="button" class="day ${d===sel?"on ":""}${has?"has":""}" data-d="${d}"><span class="dow">${x.toLocaleDateString("en-GB",{weekday:"short"})}</span><b>${x.getDate()}</b></button>`;
  }).join("");
  document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{sel=b.dataset.d;render()});
  $("selectedDate").textContent=label(sel);

  const ev=S.events.filter(e=>e.day===sel).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
  $("events").innerHTML=ev.length
    ? `<div class="sectionHead"><h2>Plan</h2><span class="muted">${ev.length} ${ev.length===1?"thing":"things"}</span></div>`+
      ev.map(e=>`<div class="event">
        <div class="time">${esc(e.time||"All day")}</div>
        <div><h3>${esc(e.name)}</h3>
        ${e.location?`<div class="muted">${esc(e.location)}</div>`:""}
        ${e.maps?`<a class="maps" target="_blank" rel="noopener" href="${esc(e.maps)}">Open in Google Maps ↗</a>`:""}
        ${e.notes?`<div class="eventMeta">${esc(e.notes)}</div>`:""}
        ${e.cost?`<div class="eventMeta">${eur(e.cost)} · ${esc(e.payer||"")}</div>`:""}
        </div>
        <div><button type="button" class="iconBtn" data-edit-event="${esc(e.id)}">✎</button><button type="button" class="iconBtn" data-remove-event="${esc(e.id)}">×</button></div>
      </div>`).join("")
    : '<div class="empty">Nothing planned for this day.<br>Use + to add an activity.</div>';

  let m=0,d=0;
  S.expenses.forEach(e=>e.payer==="Maria"?m+=+e.amount||0:d+=+e.amount||0);
  $("m").textContent=eur(m);$("d").textContent=eur(d);
  const diff=m-d;
  $("bal").innerHTML=diff===0?"<span>All even</span><strong>€0 owed</strong>":diff>0?`<span>Dil owes Maria</span><strong>${eur(diff/2)}</strong>`:`<span>Maria owes Dil</span><strong>${eur(-diff/2)}</strong>`;

  $("expensesList").innerHTML=S.expenses.length
    ? `<div class="sectionHead"><h2>Expenses</h2><span class="muted">${S.expenses.length}</span></div>`+
      S.expenses.slice().reverse().map(e=>{
        const total=+e.total||+e.amount||0,paid=+e.paid||+e.amount||0,c=e.currency||"EUR",st=stat(total,paid),rem=Math.max(0,total-paid);
        const pt=c==="MUR"?Math.round(paid).toLocaleString()+" MUR":eur(paid),tt=c==="MUR"?Math.round(total).toLocaleString()+" MUR":eur(total);
        return `<div class="expense"><div class="expenseGrid"><div>
          <div class="expenseTitle">${esc(e.name)}</div>
          <div class="expenseMeta">${esc(e.payer)} · ${pt} of ${tt}${c==="MUR"?` · ${eur(toEur(paid,c))} paid`:""}</div>
          <span class="badge ${st}">${st==="paid"?"Paid":st==="partial"?"Partially paid":"Pending"}</span>
          ${rem>0?`<div class="remaining">Remaining: ${c==="MUR"?Math.round(rem).toLocaleString()+" MUR":eur(rem)}</div>`:""}
        </div><div class="expenseAmount">
          <button type="button" class="iconBtn" data-edit-expense="${esc(e.id)}">✎</button>
          <button type="button" class="iconBtn" data-remove-expense="${esc(e.id)}">×</button>
          <div>${eur(e.amount)}</div>
        </div></div></div>`;
      }).join("")
    : '<div class="empty">No expenses yet.<br>Tap + to add one.</div>';
}
function modal(id){document.querySelectorAll(".modal").forEach(x=>x.classList.remove("on"));$(id).classList.add("on")}function close(){document.querySelectorAll(".modal").forEach(x=>x.classList.remove("on"))}
function view(v){document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id===v));document.querySelectorAll(".bottom button[data-v]").forEach(x=>x.classList.toggle("on",x.dataset.v===v))}
function fillDays(){$("day").innerHTML=dates.map(d=>'<option value="'+d+'">'+short(d)+"</option>").join("")}
function openActivity(id){fillDays();$("activityForm").dataset.id=id||"";$("activityHeading").textContent=id?"Edit activity":"Add activity";if(id){let e=S.events.find(x=>x.id===id);$("name").value=e?.name||"";$("day").value=e?.day||sel;$("time").value=e?.time||"";$("loc").value=e?.location||"";$("maps").value=e?.maps||"";$("notes").value=e?.notes||"";$("cost").value=e?.cost||"";$("payer").value=e?.payer||"Maria"}else{$("activityForm").reset();$("day").value=sel;$("payer").value="Maria"}modal("activityModal")}
function setExpenseChoice(){
  document.querySelectorAll("#currencyChoices button").forEach(b=>b.classList.toggle("on",b.dataset.currency===$("expenseForm").dataset.currency));
  document.querySelectorAll("#payerChoices button").forEach(b=>b.classList.toggle("on",b.dataset.payer===$("expenseForm").dataset.payer));
  $("totalBox").classList.toggle("hidden",!$("notFullyPaid").checked);$("partialToggle").classList.toggle("on",$("notFullyPaid").checked);
}
function preview(){
  const c=$("expenseForm").dataset.currency||"EUR",paid=+$("expensePaid").value||0,total=+$("expenseTotal").value||0;
  $("eurPreview").textContent=eur(toEur(paid,c));
  $("paidPreview").textContent=c==="MUR"?"Actual paid · "+paid.toLocaleString()+" MUR":"Actual amount paid";
  $("rateText").textContent=c==="MUR"?"1 MUR ≈ "+rate.toFixed(6)+" EUR":"This is the amount that will count toward your split.";
  setExpenseChoice();
}
async function getRate(){try{const x=await (await fetch("https://open.er-api.com/v6/latest/MUR")).json();if(x?.rates?.EUR)rate=x.rates.EUR}catch(e){}preview()}
function openExpense(id){
  $("expenseError").textContent="";$("expenseForm").dataset.id=id||"";
  $("expenseHeading").textContent=id?"Edit expense":"Add expense";
  if(id){
    const e=S.expenses.find(x=>x.id===id);
    $("expenseTitle").value=e?.name||"";
    $("expensePaid").value=e?.paid??e?.amount??"";
    $("expenseTotal").value=e?.total??"";
    $("notFullyPaid").checked=(+e?.total||0)>(+e?.paid||0);
    $("expenseForm").dataset.currency=e?.currency||"EUR";
    $("expenseForm").dataset.payer=e?.payer||"";
  }else{
    $("expenseForm").reset();
    $("expenseForm").dataset.currency="EUR";
    $("expenseForm").dataset.payer="";
    $("notFullyPaid").checked=false;
  }
  setExpenseChoice();preview();modal("expenseModal");
  if($("expenseForm").dataset.currency==="MUR")getRate();
}
async function expenseSubmit(e){
  e.preventDefault();$("expenseError").textContent="";
  const id=e.target.dataset.id||uid(),c=e.target.dataset.currency||"EUR",payer=e.target.dataset.payer||"";
  const paid=+$("expensePaid").value||0,partial=$("notFullyPaid").checked,total=partial?(+$("expenseTotal").value||0):paid;
  if(!e.target.querySelector("#expenseTitle").value.trim())return $("expenseError").textContent="Add a title.";
  if(!payer)return $("expenseError").textContent="Choose who paid.";
  if(paid<0)return $("expenseError").textContent="Enter a valid amount.";
  if(partial&&total<=0)return $("expenseError").textContent="Enter the total amount due.";
  if(partial&&paid>total)return $("expenseError").textContent="Amount paid can't be more than the total.";
  const x={id,name:$("expenseTitle").value.trim(),amount:toEur(paid,c),payer,currency:c,total,paid,status:stat(total,paid),remaining:Math.max(0,total-paid)};
  S.expenses=S.expenses.some(v=>v.id===id)?S.expenses.map(v=>v.id===id?{...v,eventId:v.eventId,...x}:v):[...S.expenses,x];
  close();render();await save();
}
async function activitySubmit(e){e.preventDefault();let id=e.target.dataset.id||uid(),x={id,name:$("name").value.trim(),day:$("day").value,time:$("time").value,location:$("loc").value.trim(),maps:$("maps").value.trim(),notes:$("notes").value.trim(),cost:+$("cost").value||0,payer:$("payer").value};if(!x.name)return;let old=S.events.find(v=>v.id===id);S.events=old?S.events.map(v=>v.id===id?x:v):[...S.events,x];let linked=S.expenses.find(v=>v.eventId===id);if(linked){if(x.cost>0)S.expenses=S.expenses.map(v=>v.id===linked.id?{...v,name:x.name,amount:x.cost,total:x.cost,paid:x.cost,payer:x.payer,currency:"EUR",status:"paid",remaining:0}:v);else S.expenses=S.expenses.filter(v=>v.id!==linked.id)}else if(x.cost>0)S.expenses=[...S.expenses,{id:uid(),eventId:id,name:x.name,amount:x.cost,total:x.cost,paid:x.cost,payer:x.payer,currency:"EUR",status:"paid",remaining:0}];close();render();await save()}
async function removeEvent(id){if(!confirm("Delete this activity?"))return;S.events=S.events.filter(e=>e.id!==id);S.expenses=S.expenses.filter(e=>e.eventId!==id);render();await save()}async function removeExpense(id){if(!confirm("Delete this expense?"))return;S.expenses=S.expenses.filter(e=>e.id!==id);render();await save()}function editEvent(id){openActivity(id)}function editExpense(id){openExpense(id)}
document.querySelectorAll(".bottom button[data-v]").forEach(b=>b.onclick=()=>view(b.dataset.v));$("plus").onclick=()=>modal("choiceModal");$("choiceCancel").onclick=close;$("addActivity").onclick=()=>openActivity();$("addExpense").onclick=()=>openExpense();$("activityCancel").onclick=close;$("expenseCancel").onclick=close;$("expenseClose").onclick=close;$("activityForm").onsubmit=activitySubmit;$("expenseForm").onsubmit=expenseSubmit;document.querySelectorAll("#currencyChoices button").forEach(b=>b.onclick=()=>{ $("expenseForm").dataset.currency=b.dataset.currency; if(b.dataset.currency==="MUR")getRate(); else preview(); });
document.querySelectorAll("#payerChoices button").forEach(b=>b.onclick=()=>{ $("expenseForm").dataset.payer=b.dataset.payer; setExpenseChoice(); });
$("partialToggle").onclick=()=>{ $("notFullyPaid").checked=!$("notFullyPaid").checked; $("totalBox").classList.toggle("hidden",!$("notFullyPaid").checked); preview(); };
$("expensePaid").oninput=preview;$("expenseTotal").oninput=preview;document.addEventListener("click",e=>{
  const b=e.target.closest("[data-edit-event],[data-remove-event],[data-edit-expense],[data-remove-expense]");
  if(!b)return;
  if(b.dataset.editEvent)editEvent(b.dataset.editEvent);
  else if(b.dataset.removeEvent)removeEvent(b.dataset.removeEvent);
  else if(b.dataset.editExpense)editExpense(b.dataset.editExpense);
  else if(b.dataset.removeExpense)removeExpense(b.dataset.removeExpense);
});
document.querySelectorAll(".modal").forEach(m=>m.onclick=e=>{if(e.target===m)close()});
load();setInterval(refresh,10000);
</script></body></html>
