<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mauritius ’26</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ed;color:#171715;font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}.wrap{max-width:720px;margin:auto;padding:28px 18px 90px}h1{font-size:42px;letter-spacing:-.06em;margin:5px 0}.muted{color:#777}.nav{display:flex;gap:8px;margin:24px 0}.nav button,.day,.add,.save,.maps{border:0;border-radius:14px;padding:11px 15px;background:#fff;font:inherit;font-weight:650}.nav .on,.save,.add{background:#171715;color:#fff}.days{display:flex;gap:7px;overflow:auto}.day{min-width:64px;text-align:left}.day.on{background:#0d5148;color:#fff}.card{background:#fff;border:1px solid #e5e1d9;border-radius:20px;padding:16px;margin:12px 0}.event,.expense{padding:14px 0;border-bottom:1px solid #eee}.event:last-child,.expense:last-child{border:0}.event{display:grid;grid-template-columns:58px 1fr auto;gap:10px}.event h3{margin:0 0 4px}.time{font-weight:700}.maps{display:inline-block;margin-top:5px;background:#e8f0ed;color:#0d5148;text-decoration:none}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid #e5e1d9;border-radius:18px;padding:15px}.stat strong{display:block;font-size:24px;margin-top:4px}.balance{background:#0d5148;color:#fff;border-radius:20px;padding:18px;margin:12px 0}.balance strong{display:block;font-size:24px}.fab{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border:0;border-radius:50%;background:#171715;color:#fff;font-size:28px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:end}.modal.on{display:flex}.sheet{background:#f4f2ed;width:100%;max-width:560px;margin:auto;padding:20px;border-radius:24px 24px 0 0}.form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;padding:12px;margin-top:5px;border:1px solid #ddd8cf;border-radius:12px;background:#fff;font:inherit}textarea{min-height:70px}.actions{display:flex;justify-content:flex-end;gap:8px}.ghost{border:0;background:#fff;padding:11px 15px;border-radius:14px}.view{display:none}.view.on{display:block}.status{font-size:12px;margin-top:8px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#37a36f;margin-right:5px}</style>
<div class="wrap"><div class="muted">OUR ISLAND TRIP</div><h1>Mauritius ’26</h1><div class="muted">13–21 October · Maria + Dil</div><div class="status"><span class="dot"></span><span id="status">Syncing</span></div>
<div class="nav"><button class="on" data-v="schedule">Schedule</button><button data-v="expenses">Expenses</button></div>
<section id="schedule" class="view on"><div class="days" id="days"></div><div class="card" id="events"></div></section>
<section id="expenses" class="view"><div class="summary"><div class="stat"><span class="muted">Maria paid</span><strong id="m">€0</strong></div><div class="stat"><span class="muted">Dil paid</span><strong id="d">€0</strong></div></div><div class="balance" id="bal"></div><div class="card" id="expensesList"></div></section></div>
<button class="fab" id="fab">+</button>
<div class="modal" id="modal"><div class="sheet"><h2>Add activity</h2><form class="form" id="form"><label>Name<input id="name" required placeholder="Whale swimming"></label><div class="row"><label>Day<select id="day"></select></label><label>Time<input id="time" type="time"></label></div><label>Location<input id="loc"></label><label>Google Maps link<input id="maps" type="url"></label><label>Notes<textarea id="notes"></textarea></label><div class="row"><label>Cost €<input id="cost" type="number" min="0" step=".01"></label><label>Paid by<select id="payer"><option>Maria</option><option>Dil</option></select></label></div><div class="actions"><button type="button" class="ghost" id="cancel">Cancel</button><button class="save">Save</button></div></form></div></div>
<script>
const API="https://flcnidtinfhpjdvqvegl.supabase.co/functions/v1/trip-api",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsY25pZHRpbmZocGpkdnF2ZWdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTkwMTAsImV4cCI6MjEwNjc3NTAxMH0.jBWofh1-jw_8tNAJJsFDigNpU2LT-FM6zlTHTE7o9h0";
let S={people:["Maria","Dil"],events:[],expenses:[]},sel="2026-10-13";const dates=Array.from({length:9},(_,i)=>new Date(Date.UTC(2026,9,13+i)).toISOString().slice(0,10));const $=id=>document.getElementById(id),eur=n=>"€"+(+n||0).toFixed(2).replace(".00","");const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(method="GET",body){let r=await fetch(API,{method,headers:{"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(await r.text());return r.json()}
function render(){ $("days").innerHTML=dates.map(d=>{let x=new Date(d+"T12:00:00");return '<button class="day '+(d==sel?"on":"")+'" data-d="'+d+'">'+x.toLocaleDateString("en-GB",{weekday:"short"})+"<br><b>"+x.getDate()+"</b></button>"}).join("");document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{sel=b.dataset.d;render()});let es=S.events.filter(e=>e.day==sel).sort((a,b)=>(a.time||"").localeCompare(b.time||""));$("events").innerHTML=es.length?es.map(e=>'<div class="event"><div class="time">'+(e.time||"—")+'</div><div><h3>'+esc(e.name)+'</h3><div class="muted">'+esc(e.location||"")+'</div>'+(e.maps?'<a class="maps" target="_blank" href="'+esc(e.maps)+'">Open in Google Maps ↗</a>':"")+(e.notes?'<div class="muted">'+esc(e.notes)+'</div>':"")+(e.cost?'<div class="muted">'+eur(e.cost)+" · "+esc(e.payer)+"</div>":"")+'</div><button onclick="removeEvent(\''+e.id+'\')">×</button></div>').join(""):'<div class="muted" style="padding:30px;text-align:center">Nothing planned yet.</div>';let m=0,d=0;S.expenses.forEach(e=>e.payer=="Maria"?m+=+e.amount:d+=+e.amount);$("m").textContent=eur(m);$("d").textContent=eur(d);let b=(m-d)/2;$("bal").innerHTML=b==0?"<span>All even</span><strong>€0 owed</strong>":b>0?"<span>Dil owes Maria</span><strong>"+eur(b)+"</strong>":"<span>Maria owes Dil</span><strong>"+eur(-b)+"</strong>";$("expensesList").innerHTML=S.expenses.length?S.expenses.slice().reverse().map(e=>'<div class="expense"><b>'+esc(e.name)+'</b><br><span class="muted">'+esc(e.payer)+'</span><strong style="float:right">'+eur(e.amount)+'</strong></div>').join(""):'<div class="muted" style="padding:30px;text-align:center">No expenses yet.</div>'}
async function save(){ $("status").textContent="Saving…";try{await api("PUT",S);$("status").textContent="Synced"}catch(e){$("status").textContent="Save failed";console.error(e)}}async function load(){try{let x=await api();S={people:x.people||["Maria","Dil"],events:x.events||[],expenses:x.expenses||[]};$("status").textContent="Synced";render()}catch(e){$("status").textContent="Connection failed";console.error(e)}}
$("day").innerHTML=dates.map(d=>'<option value="'+d+'">'+new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+"</option>").join("");$("fab").onclick=()=>{$("modal").classList.add("on");$("day").value=sel};$("cancel").onclick=()=>$("modal").classList.remove("on");
$("form").onsubmit=async e=>{e.preventDefault();let c=+$("cost").value||0,x={id:crypto.randomUUID(),name:$("name").value,day:$("day").value,time:$("time").value,location:$("loc").value,maps:$("maps").value,notes:$("notes").value,cost:c,payer:$("payer").value};S.events.push(x);if(c)S.expenses.push({id:crypto.randomUUID(),name:x.name,amount:c,payer:x.payer,date:x.day});sel=x.day;$("modal").classList.remove("on");render();await save()};window.removeEvent=async id=>{S.events=S.events.filter(x=>x.id!==id);render();await save()};document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));$(b.dataset.v).classList.add("on")});load();
</script></html>
